name: Publish Element Web release

on:
  schedule:
    - cron: '0 3 * * 1,3,5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-element-web-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check deployment
        run: bash tests/deploy.sh
      - name: Check release publishing
        run: bash tests/release.sh
      - name: Publish latest upstream release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-release.sh
